name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix ui --no-audit --no-fund

      - name: Build UI
        run: npm run build --prefix ui

      # No migration step: the CI token has Workers and R2 but not D1 Edit, so
      # `wrangler d1 execute --remote` 401s here. Until that permission is added,
      # apply schema.sql by hand before merging a schema change:
      #   npx wrangler d1 execute brain-index --remote --file=schema.sql
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
