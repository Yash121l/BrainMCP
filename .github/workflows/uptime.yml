name: Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /health
        run: |
          body=$(curl -sS --fail-with-body --max-time 20 --retry 2 --retry-delay 10 --retry-all-errors https://brain.yashlunawat.com/health)
          echo "$body"
          echo "$body" | jq -e '.ok == true and .notes >= 0'
